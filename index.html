<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// 헬로키티 테마: 기본 켜짐, 선택은 브라우저에 기억
try { document.documentElement.dataset.skin = localStorage.getItem("skin") || "kitty"; }
catch (e) { document.documentElement.dataset.skin = "kitty"; }
</script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#16181d; --sub:#6b7280; --line:#e6e8ec;
  --up:#e5383b; --down:#1f6feb; --flat:#6b7280; --accent:#111827; --chip:#eef0f3;
  --open:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --card:#171a1f; --text:#eceef2; --sub:#9097a3; --line:#262a31;
    --up:#ff5c5f; --down:#4c9bff; --accent:#f3f4f6; --chip:#22262d; --open:#34d399;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --card:#171a1f; --text:#eceef2; --sub:#9097a3; --line:#262a31;
  --up:#ff5c5f; --down:#4c9bff; --accent:#f3f4f6; --chip:#22262d; --open:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1200px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.top .upd{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
nav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--sub);font:inherit;font-weight:500;
  padding:12px 10px;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
section.mkt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mhead h2{font-size:17px;font-weight:700}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.badge.live{color:var(--open)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--open);margin-right:5px;vertical-align:1px}
.mhead .hours{margin-left:auto;font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:520px){
  main{padding:12px}
  section.mkt{padding:14px 12px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:10px}
  .card .p{font-size:17px}
  .card .c{font-size:12px}
  .mhead .hours{font-size:11px}
}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card .n{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .p{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.card .c{font-size:13px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.card svg{display:block;width:100%;height:34px;margin-top:8px}
.sub{font-size:13px;color:var(--sub);font-weight:500;margin:16px 0 6px}
.rows .row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.row .n{flex:1;min-width:0;font-weight:500}
.row .n small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row svg{width:70px;height:26px;flex:none}
.row .r{text-align:right;font-variant-numeric:tabular-nums;min-width:92px}
.row .r b{display:block;font-weight:700}
.row .r span{font-size:13px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.err{color:var(--sub);font-size:13px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:13px;
  padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.nh a{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.nh a:first-child{border-top:0}
.nh a:hover{background:var(--chip)}
.nh .rk{width:22px;flex:none;color:var(--sub);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.nh .n{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .n small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.nh .mk{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--sub);margin-left:4px;font-weight:400;vertical-align:1px}
.nh .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.nh .r b{display:block;font-weight:700}
.nh .r span{font-size:13px}
.nh .keep{font-size:11px;color:var(--up);margin-left:4px}
/* 매크로 차트 */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#e6e8ec;--axis:#9097a3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#262a31;--axis:#7b8290}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#262a31;--axis:#7b8290}
#tab-macro > .filters{margin-bottom:12px}
.mcols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1000px){.mcols{grid-template-columns:1fr 1fr}.mcols section:first-child{grid-column:1/-1}}
.tiles{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:6px}
.tile .tn{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.tile .tn i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tile .tv{font-size:20px;font-weight:700;letter-spacing:-.3px}
.tile .tv small{font-size:13px;font-weight:500;margin-left:6px}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--axis);font-variant-numeric:tabular-nums}
.tip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;
  font-variant-numeric:tabular-nums;display:none;z-index:2}
.tip b{display:block;margin-bottom:4px;font-weight:500;color:var(--sub)}
.tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.unit{font-size:12px;color:var(--sub);margin-left:auto}
/* 추정치 */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
.ctrl .filters{margin:0;flex-wrap:wrap}
.breadth{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.breadth .bl{font-size:13px;color:var(--sub)}
.breadth .bv{font-size:18px;font-weight:700}
.breadth .bar{flex:1;min-width:160px;height:8px;border-radius:4px;background:var(--chip);display:flex;overflow:hidden;gap:2px}
.breadth .bar span{display:block;height:100%}
.es a{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.es a:first-child{border-top:0}
.es a:hover{background:var(--chip)}
.es .rk{width:22px;flex:none;color:var(--sub);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.es .n{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es .n small{display:block;font-size:11.5px;color:var(--sub);font-weight:400;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.es .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.es .r b{display:block;font-weight:700}
.es .r span{font-size:12px;color:var(--sub)}
.es .tag{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:500;vertical-align:1px}
.es .tag.up{background:color-mix(in srgb,var(--up) 14%,transparent)}
.es .tag.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.note{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:48px 16px;text-align:center;color:var(--sub)}
.skel{height:300px;border-radius:14px;background:var(--card);border:1px solid var(--line);opacity:.6}
/* 헬로키티 테마 */
:root[data-skin="kitty"]{
  --bg:#fff0f5; --card:#ffffff; --text:#4a2c3a; --sub:#a86b85; --line:#ffd1e1;
  --up:#e8174f; --down:#3f7fe0; --flat:#a86b85; --accent:#ff4f8b; --chip:#ffe4ee; --open:#ff4f8b;
  --s1:#ff4f8b; --s2:#e8174f; --s3:#4fb3e8; --grid:#ffe1ec; --axis:#c58aa3;
  --dot:#ffd6e5; --shadow:0 4px 16px rgba(255,79,139,.12);
}
@media (prefers-color-scheme: dark){
  :root[data-skin="kitty"]:not([data-theme="light"]){
    --bg:#2a1620; --card:#3a1f2d; --text:#ffe8f0; --sub:#e3a3be; --line:#5a3044;
    --up:#ff6b8f; --down:#7fb2ff; --flat:#e3a3be; --accent:#ff7aa8; --chip:#4a2738; --open:#ff7aa8;
    --s1:#ff7aa8; --s2:#ff4d6d; --s3:#6cc4f0; --grid:#4a2738; --axis:#c48aa3;
    --dot:#341b27; --shadow:0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-skin="kitty"][data-theme="dark"]{
  --bg:#2a1620; --card:#3a1f2d; --text:#ffe8f0; --sub:#e3a3be; --line:#5a3044;
  --up:#ff6b8f; --down:#7fb2ff; --flat:#e3a3be; --accent:#ff7aa8; --chip:#4a2738; --open:#ff7aa8;
  --s1:#ff7aa8; --s2:#ff4d6d; --s3:#6cc4f0; --grid:#4a2738; --axis:#c48aa3;
  --dot:#341b27; --shadow:0 4px 16px rgba(0,0,0,.3);
}
[data-skin="kitty"] body{background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 18%,transparent 19%),radial-gradient(var(--dot) 18%,transparent 19%);
  background-size:28px 28px;background-position:0 0,14px 14px}
[data-skin="kitty"] header{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);
  border-bottom:2px dashed var(--line)}
[data-skin="kitty"] .top h1,[data-skin="kitty"] .mhead h2{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;color:var(--accent)}
[data-skin="kitty"] .top h1{font-size:22px;letter-spacing:0}
[data-skin="kitty"] .mhead h2{font-size:19px}
[data-skin="kitty"] nav button{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;font-size:16px}
[data-skin="kitty"] nav button.on{color:var(--accent);font-weight:400;border-bottom-width:3px}
[data-skin="kitty"] section.mkt,[data-skin="kitty"] .breadth{border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
[data-skin="kitty"] section.mkt{position:relative}
[data-skin="kitty"] section.mkt::after{content:"🎀";position:absolute;top:-12px;right:14px;font-size:22px;transform:rotate(12deg)}
[data-skin="kitty"] .card{border-radius:18px;background:var(--card);transition:transform .15s}
[data-skin="kitty"] .card:hover{transform:translateY(-2px)}
[data-skin="kitty"] .filters button{border-width:2px}
[data-skin="kitty"] .filters button.on{color:#fff}
[data-skin="kitty"] .soon,[data-skin="kitty"] .skel{border-radius:22px}
[data-skin="kitty"] .tip{border-radius:14px;border-width:2px}
.kitty-face{display:none;width:30px;height:26px;vertical-align:-4px;margin-right:6px}
[data-skin="kitty"] .kitty-face{display:inline-block}
.skin-btn{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:999px;cursor:pointer;flex:none}
[data-skin="kitty"] .skin-btn{border-width:2px;color:var(--accent);font-weight:500}
.top .right{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<header>
  <div class="top"><h1><svg class="kitty-face" viewBox="0 0 60 52" aria-hidden="true"><path d="M8 20 L6 4 L20 13 Z M52 20 L54 4 L40 13 Z" fill="#fff" stroke="#4a2c3a" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="30" cy="30" rx="25" ry="19" fill="#fff" stroke="#4a2c3a" stroke-width="2.5"/><ellipse cx="20" cy="31" rx="2.6" ry="3.4" fill="#4a2c3a"/><ellipse cx="40" cy="31" rx="2.6" ry="3.4" fill="#4a2c3a"/><ellipse cx="30" cy="36" rx="3" ry="2.2" fill="#ffd34d" stroke="#4a2c3a" stroke-width="1.2"/><path d="M3 30h9M3 35l9-2M57 30h-9M57 35l-9-2" stroke="#4a2c3a" stroke-width="2" stroke-linecap="round"/><g transform="translate(44 12) rotate(15)"><path d="M0 0 L-11 -8 L-11 8 Z M0 0 L11 -8 L11 8 Z" fill="#ff2d6f" stroke="#4a2c3a" stroke-width="1.5" stroke-linejoin="round"/><circle r="4" fill="#ff2d6f" stroke="#4a2c3a" stroke-width="1.5"/></g></svg>내 대시보드</h1><div class="right"><span class="upd" id="upd">불러오는 중…</span><button class="skin-btn" id="skin">🎀 키티</button></div></div>
  <nav id="tabs">
    <button data-tab="market" class="on">국장·미장</button>
    <button data-tab="newhigh">신고가</button>
    <button data-tab="watch">관심종목</button>
    <button data-tab="macro">매크로</button>
    <button data-tab="news">주요뉴스</button>
    <button data-tab="estimate">추정치</button>
  </nav>
</header>
<main>
  <div id="tab-market">
    <div class="cols"><div class="skel"></div><div class="skel"></div></div>
  </div>
  <div id="tab-newhigh" hidden>
    <section class="mkt">
      <div class="mhead"><h2>오늘 52주 신고가</h2><span class="badge" id="nh-count">-</span>
        <span class="hours" id="nh-sort"></span></div>
      <div class="filters" id="nh-filter">
        <button data-m="all" class="on">전체</button><button data-m="코스피">코스피</button><button data-m="코스닥">코스닥</button>
      </div>
      <div class="nh" id="nh-list"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
    </section>
  </div>
  <div id="tab-macro" hidden>
    <div class="filters" id="mc-range">
      <button data-d="30">1개월</button><button data-d="91" class="on">3개월</button>
      <button data-d="182">6개월</button><button data-d="365">1년</button>
    </div>
    <div class="mcols" id="mc-body"><div class="skel"></div></div>
  </div>
  <div id="tab-estimate" hidden>
    <div class="ctrl">
      <div class="filters" id="es-period"><button data-v="1" class="on">1주</button><button data-v="2">1개월</button></div>
      <div class="filters" id="es-item"><button data-v="op" class="on">영업이익</button><button data-v="np">순이익</button><button data-v="sales">매출</button><button data-v="eps">EPS</button></div>
      <div class="filters" id="es-year"></div>
      <div class="filters" id="es-market"><button data-v="all" class="on">전체</button><button data-v="코스피">코스피</button><button data-v="코스닥">코스닥</button></div>
    </div>
    <div class="breadth" id="es-breadth"></div>
    <div class="cols" id="es-body"><div class="skel"></div><div class="skel"></div></div>
    <p class="note" id="es-note"></p>
  </div>
  <div id="tab-other" hidden><div class="soon">이 탭은 곧 만들어요 🛠</div></div>
</main>
<script>
const $ = s => document.querySelector(s);

// 테마 전환 (헬로키티 ↔ 기본)
const skinLabel = () => $("#skin").textContent = document.documentElement.dataset.skin === "kitty" ? "기본 테마" : "🎀 키티 테마";
$("#skin").onclick = () => {
  const next = document.documentElement.dataset.skin === "kitty" ? "basic" : "kitty";
  document.documentElement.dataset.skin = next;
  try { localStorage.setItem("skin", next); } catch (e) {}
  skinLabel();
};
skinLabel();

// 탭 전환
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  const tab = b.dataset.tab, built = ["market", "newhigh", "macro", "estimate"];
  for (const t of built) $("#tab-" + t).hidden = t !== tab;
  $("#tab-other").hidden = built.includes(tab);
  if (tab === "newhigh") loadHighs();
  if (tab === "macro") loadMacro();
  if (tab === "estimate") loadEstimates();
  try { localStorage.setItem("tab", b.dataset.tab); } catch (e) {}
});

const dir = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const arrow = v => v > 0 ? "▲" : v < 0 ? "▼" : "–";

function fmt(q, v) {
  if (v == null) return "-";
  const krwStock = q.currency === "KRW" && !q.symbol.startsWith("^") && q.symbol !== "KRW=X";
  const d = krwStock ? 0 : 2;
  return v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d});
}

function spark(arr, cls) {
  if (!arr || arr.length < 2) return "<svg></svg>";
  const min = Math.min(...arr), max = Math.max(...arr), span = max - min || 1;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * 100).toFixed(1)},${(30 - (v - min) / span * 28 - 1).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none"
    stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" class="${cls}" stroke-linejoin="round"/></svg>`;
}

function card(q) {
  if (q.error) return `<div class="card"><div class="n">${q.name}</div><div class="err">불러오기 실패</div></div>`;
  const c = dir(q.change);
  return `<div class="card"><div class="n">${q.name}</div>
    <div class="p">${fmt(q, q.price)}</div>
    <div class="c ${c}">${arrow(q.change)} ${fmt(q, Math.abs(q.change))} (${q.pct >= 0 ? "+" : ""}${q.pct.toFixed(2)}%)</div>
    <div class="${c}">${spark(q.spark, "")}</div></div>`;
}

function row(q) {
  if (q.error) return `<div class="row"><div class="n">${q.name}</div><div class="err">불러오기 실패</div></div>`;
  const c = dir(q.change);
  const unit = q.currency === "USD" ? "$" : "";
  return `<div class="row"><div class="n">${q.name}<small>${q.symbol}</small></div>
    <span class="${c}">${spark(q.spark, "")}</span>
    <div class="r"><b>${unit}${fmt(q, q.price)}</b><span class="${c}">${q.pct >= 0 ? "+" : ""}${q.pct.toFixed(2)}%</span></div></div>`;
}

function status(q) {
  const now = Date.now() / 1000;
  const live = q && q.open && now >= q.open && now <= q.close;
  const t = s => new Date(s * 1000).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
  return {
    badge: `<span class="badge ${live ? "live" : ""}">${live ? "장중" : "장마감"}</span>`,
    hours: q && q.open ? `한국시간 ${t(q.open)}–${t(q.close)}` : ""
  };
}

function market(title, idx, stocks, ref) {
  const s = status(ref);
  return `<section class="mkt">
    <div class="mhead"><h2>${title}</h2>${s.badge}<span class="hours">${s.hours}</span></div>
    <div class="grid">${idx.map(card).join("")}</div>
    <div class="sub">관심 종목</div>
    <div class="rows">${stocks.map(row).join("")}</div></section>`;
}

// 매크로 탭
let macroData = null, macroAt = 0, macroDays = 91;
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)"];
const MACRO_SECTIONS = [
  {key: "oil", title: "유가", unit: "달러/배럴", rate: false},
  {key: "kr_bond", title: "한국 국채 금리", unit: "%", rate: true},
  {key: "us_bond", title: "미국 국채 금리", unit: "%", rate: true},
  {key: "dxy", title: "달러인덱스", unit: "포인트", rate: false},
  {key: "gold", title: "금", unit: "달러/온스", rate: false},
];
const num2 = (v, d) => v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d});
try { const d = +localStorage.getItem("macroDays"); if (d) macroDays = d; } catch (e) {}

function sinceDays(points, days) {
  const cut = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  return points.filter(p => p[0] >= cut);
}

function tileHTML(s, i, rate) {
  const pts = s.points, last = pts.at(-1), prev = pts.at(-2);
  const diff = last && prev ? last[1] - prev[1] : 0;
  const chg = rate ? `${diff >= 0 ? "+" : ""}${(diff * 100).toFixed(1)}bp`
                   : `${diff >= 0 ? "+" : ""}${(diff / prev[1] * 100).toFixed(2)}%`;
  return `<div class="tile"><div class="tn"><i style="background:${COLORS[i]}"></i>${s.name}</div>
    <div class="tv">${last ? num2(last[1], rate ? 3 : 2) : "-"}<small class="${dir(diff)}">${arrow(diff)} ${chg}</small></div></div>`;
}

function lineChart(box, series, rate) {
  const W = Math.max(box.clientWidth, 280), H = W < 500 ? 190 : 230;
  const pad = {l: 8, r: 44, t: 10, b: 22};
  const dates = [...new Set(series.flatMap(s => s.points.map(p => p[0])))].sort();
  if (dates.length < 2) { box.innerHTML = `<div class="err">데이터가 부족해요</div>`; return; }
  const vals = series.flatMap(s => s.points.map(p => p[1]));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * 0.08 || 1; lo -= padv; hi += padv;
  const x = d => pad.l + dates.indexOf(d) / (dates.length - 1) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  // 눈금
  const step = (hi - lo) / 4, ticks = [0, 1, 2, 3, 4].map(i => lo + step * i);
  const grid = ticks.map(t => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text x="${W - pad.r + 6}" y="${y(t) + 4}">${num2(t, rate || hi - lo < 20 ? (rate ? 2 : 1) : 0)}</text>`).join("");
  const xi = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
  const xl = xi.map((i, k) => `<text x="${x(dates[i])}" y="${H - 4}" text-anchor="${["start", "middle", "end"][k]}">${dates[i].slice(2).replace(/-/g, ".")}</text>`).join("");
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${COLORS[i]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
    points="${s.points.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")}"/>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${grid}${xl}${lines}
    <g class="hover" style="display:none"><line class="cx" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-dasharray="3 3"/>
    ${series.map((s, i) => `<circle r="4.5" fill="${COLORS[i]}" stroke="var(--card)" stroke-width="2"/>`).join("")}</g>
    <rect x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent" style="touch-action:pan-y"/></svg>
    <div class="tip"></div>`;
  const svg = box.querySelector("svg"), g = box.querySelector(".hover"), tip = box.querySelector(".tip");
  const valueAt = (s, d) => { let v = null; for (const p of s.points) { if (p[0] > d) break; v = p[1]; } return v; };
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.round((px - pad.l) / (W - pad.l - pad.r) * (dates.length - 1));
    const d = dates[Math.max(0, Math.min(dates.length - 1, i))], cx = x(d);
    g.style.display = "";
    g.querySelector(".cx").setAttribute("x1", cx); g.querySelector(".cx").setAttribute("x2", cx);
    const rows = series.map((s, k) => {
      const v = valueAt(s, d), c = g.querySelectorAll("circle")[k];
      c.style.display = v == null ? "none" : ""; if (v != null) { c.setAttribute("cx", cx); c.setAttribute("cy", y(v)); }
      return `<div><span><i style="background:${COLORS[k]}"></i>${s.name}</span><span>${v == null ? "-" : num2(v, rate ? 3 : 2)}</span></div>`;
    }).join("");
    tip.innerHTML = `<b>${d.replace(/-/g, ".")}</b>${rows}`;
    tip.style.display = "block";
    const left = cx * r.width / W, tw = tip.offsetWidth;
    tip.style.left = (left + 12 + tw > r.width ? left - tw - 12 : left + 12) + "px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { g.style.display = "none"; tip.style.display = "none"; });
}

function renderMacro() {
  if (!macroData) return;
  $("#mc-body").innerHTML = MACRO_SECTIONS.map(m => `<section class="mkt">
      <div class="mhead"><h2>${m.title}</h2><span class="unit">단위: ${m.unit}</span></div>
      <div class="tiles">${macroData[m.key].map((s, i) => tileHTML(s, i, m.rate)).join("")}</div>
      <div class="chart" id="ch-${m.key}"></div></section>`).join("");
  for (const m of MACRO_SECTIONS) {
    const series = macroData[m.key].map(s => ({name: s.name, points: sinceDays(s.points, macroDays)}));
    lineChart($("#ch-" + m.key), series, m.rate);
  }
}

async function loadMacro() {
  if (macroData && Date.now() - macroAt < 600000) return renderMacro();
  try {
    macroData = await (await fetch("data/macro.json", {cache: "no-store"})).json();
    macroAt = Date.now();
    renderMacro();
  } catch (e) {
    $("#mc-body").innerHTML = `<div class="soon">불러오기 실패 · 잠시 후 다시 시도해 주세요</div>`;
  }
}

document.querySelectorAll("#mc-range button").forEach(b => {
  b.classList.toggle("on", +b.dataset.d === macroDays);
  b.onclick = () => {
    document.querySelectorAll("#mc-range button").forEach(x => x.classList.toggle("on", x === b));
    macroDays = +b.dataset.d;
    try { localStorage.setItem("macroDays", macroDays); } catch (e) {}
    renderMacro();
  };
});
let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (!$("#tab-macro").hidden) renderMacro(); }, 150); });

// 추정치 탭
let est = null, estAt = 0;
const es = {period: 1, item: "op", year: null, market: "all"};
const ITEM_NAME = {op: "영업이익", np: "순이익", sales: "매출", eps: "EPS"};
const MIN_BASE = 10; // 억원. 이보다 작은 값은 변화율이 과장돼서 제외

function money(v, item) {
  if (v == null) return "-";
  if (item === "eps") return Math.round(v).toLocaleString("ko-KR") + "원";
  const a = Math.abs(v);
  return a >= 10000 ? (v / 10000).toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "조"
                    : Math.round(v).toLocaleString("ko-KR") + "억";
}

function estRows() {
  const out = [];
  for (const s of est.stocks) {
    if (es.market !== "all" && s.market !== es.market) continue;
    const v = s[es.year]?.[es.item];
    if (!v || v[0] == null || v[es.period] == null) continue;
    const cur = v[0], prev = v[es.period], diff = cur - prev;
    if (Math.abs(diff) < 1e-9) continue;
    if (es.item !== "eps" && Math.max(Math.abs(cur), Math.abs(prev)) < MIN_BASE) continue;
    let rate, tag = "";
    if (prev === 0) { rate = diff > 0 ? -1e9 : 1e9; tag = "신규 추정"; }  // 이전 추정치가 없던 종목 → 목록 맨 뒤
    else if (prev < 0 && cur > 0) { rate = Infinity; tag = "흑자전환"; }
    else if (prev > 0 && cur <= 0) { rate = -Infinity; tag = "적자전환"; }
    else if (prev < 0 && cur < 0) { rate = diff / Math.abs(prev) * 100; tag = diff > 0 ? "적자축소" : "적자확대"; }
    else rate = diff / prev * 100;
    out.push({s, cur, prev, diff, rate, tag});
  }
  return out;
}

function estRow(r, i) {
  const c = r.diff > 0 ? "up" : "down";
  const rateTxt = r.tag === "신규 추정" || !isFinite(r.rate) ? r.tag : `${r.rate > 0 ? "+" : ""}${r.rate.toFixed(1)}%`;
  return `<a href="https://navercomp.wisereport.co.kr/v2/company/c1050001.aspx?cmp_cd=${r.s.code}" target="_blank" rel="noopener">
    <span class="rk">${i + 1}</span>
    <div class="n">${r.s.name}${r.tag && isFinite(r.rate) && r.tag !== "신규 추정" ? `<span class="tag ${c}">${r.tag}</span>` : ""}
      <small>${money(r.prev, es.item)} → <b style="color:var(--text);font-weight:500">${money(r.cur, es.item)}</b> · 주가 ${r.s.price.toLocaleString("ko-KR")} <span class="${dir(r.s.pct)}">${r.s.pct >= 0 ? "+" : ""}${r.s.pct.toFixed(1)}%</span></small></div>
    <div class="r"><b class="${c}">${rateTxt}</b><span>${r.diff > 0 ? "+" : ""}${money(r.diff, es.item)}</span></div></a>`;
}

function renderEst() {
  if (!est) return;
  if (!est.stocks.length) {
    $("#es-body").innerHTML = `<div class="soon" style="grid-column:1/-1">추정치 데이터를 모으는 중이에요. 몇 분 뒤에 다시 열어주세요.</div>`;
    return;
  }
  const rows = estRows();
  const ups = rows.filter(r => r.diff > 0).sort((a, b) => b.rate - a.rate);
  const downs = rows.filter(r => r.diff < 0).sort((a, b) => a.rate - b.rate);
  const covered = est.stocks.filter(s => (es.market === "all" || s.market === es.market) && s[es.year]?.[es.item]?.[0] != null).length;
  const flat = covered - ups.length - downs.length;
  const per = es.period === 1 ? "1주" : "1개월";
  const w = n => covered ? (n / covered * 100).toFixed(1) + "%" : "0";
  $("#es-breadth").innerHTML = `
    <div><div class="bl">${per} 상향</div><div class="bv up">${ups.length}종목</div></div>
    <div><div class="bl">${per} 하향</div><div class="bv down">${downs.length}종목</div></div>
    <div><div class="bl">변화 없음</div><div class="bv">${flat}종목</div></div>
    <div class="bar" title="상향 ${ups.length} · 변화없음 ${flat} · 하향 ${downs.length}">
      <span style="width:${w(ups.length)};background:var(--up)"></span><span style="width:${w(flat)};background:var(--line)"></span><span style="width:${w(downs.length)};background:var(--down)"></span></div>`;
  const list = (title, arr, cls) => `<section class="mkt"><div class="mhead"><h2 class="${cls}">${title}</h2>
      <span class="badge">${arr.length}종목</span><span class="hours">${ITEM_NAME[es.item]} · ${es.year.slice(0, 4)}년 · ${per} 변화율 순</span></div>
      <div class="es">${arr.length ? arr.slice(0, 50).map(estRow).join("") : `<div class="err" style="padding:24px 0">해당 종목이 없어요</div>`}</div></section>`;
  $("#es-body").innerHTML = list("▲ 상향", ups, "up") + list("▼ 하향", downs, "down");
  const t = new Date(est.updated * 1000);
  $("#es-note").textContent = `시가총액 상위 ${est.stocks.length}종목 기준 · WiseReport 컨센서스 · ${t.toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false})} 수집 · 하루 1번 갱신. `
    + `${es.item === "eps" ? "" : `${MIN_BASE}억 미만은 변화율이 과장돼 제외. `}종목을 누르면 상세 컨센서스가 열려요.`;
}

async function loadEstimates() {
  if (est && est.stocks.length && Date.now() - estAt < 600000) return renderEst();
  try {
    est = await (await fetch("data/estimates.json", {cache: "no-store"})).json();
    estAt = Date.now();
    if (est.years) {
      if (!es.year || !est.years.includes(es.year)) es.year = est.years[0];
      $("#es-year").innerHTML = est.years.map(y => `<button data-v="${y}" class="${y === es.year ? "on" : ""}">${y.slice(0, 4)}년</button>`).join("");
      bindChips("#es-year", "year", v => v);
    }
    renderEst();
  } catch (e) {
    $("#es-body").innerHTML = `<div class="soon" style="grid-column:1/-1">불러오기 실패 · 잠시 후 다시 시도해 주세요</div>`;
  }
}

function bindChips(sel, key, conv) {
  document.querySelectorAll(sel + " button").forEach(b => b.onclick = () => {
    document.querySelectorAll(sel + " button").forEach(x => x.classList.toggle("on", x === b));
    es[key] = conv(b.dataset.v);
    renderEst();
  });
}
bindChips("#es-period", "period", Number);
bindChips("#es-item", "item", v => v);
bindChips("#es-market", "market", v => v);

try { const t = localStorage.getItem("tab"); if (t) document.querySelector(`#tabs [data-tab="${t}"]`)?.click(); } catch (e) {}
load();
setInterval(() => { load(); if (!$("#tab-newhigh").hidden) loadHighs(); }, 60000);
</script>
