<style>

  --open:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --card:#171a1f; --text:#eceef2; --sub:#9097a3; --line:#262a31;

  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --card:#171a1f; --text:#eceef2; --sub:#9097a3; --line:#262a31;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;

.top{max-width:1200px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

main{max-width:1200px;margin:0 auto;padding:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}

section.mkt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mhead h2{font-size:17px;font-weight:700}

.mhead .hours{margin-left:auto;font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:520px){

}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card .n{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .p{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}

.card svg{display:block;width:100%;height:34px;margin-top:8px}
a.card{display:block;color:inherit;text-decoration:none}

.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.err{color:var(--sub);font-size:13px}

.nh a:first-child{border-top:0}

.nh .rk{width:22px;flex:none;color:var(--sub);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.nh .n{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#e6e8ec;--axis:#9097a3}

:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#262a31;--axis:#7b8290}

.mcols{display:grid;grid-template-columns:1fr;gap:16px}

[hidden]{display:none!important}
.board{display:grid;gap:16px}
.board .cols{align-items:start}
.ctrl2{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:10px}

.board .filters,.nh-ctrl .filters{flex-wrap:wrap}

.board .filters button{white-space:nowrap;flex:none}
.simg.miss{display:none}
/* 투자자별 수급 */
.fl-row{display:grid;grid-template-columns:56px 108px 1fr;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fl-row:first-of-type{border-top:0}
.fl-row .who{font-weight:600}
.fl-row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fl-row svg{display:block;width:100%;height:40px}
.fl-prog{font-size:12px;color:var(--sub);margin-top:8px;font-variant-numeric:tabular-nums}
.fl-prog b{font-weight:600}
@media (max-width:520px){.fl-row{grid-template-columns:48px 92px 1fr;gap:8px}}
/* 업종 히트맵 */
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.hm button:not(.more){border:0;border-radius:8px;padding:8px 9px;text-align:left;font:inherit;cursor:pointer;min-width:0;color:var(--text);
  background:color-mix(in srgb,var(--tint) var(--a),var(--card));outline:1px solid var(--line);outline-offset:-1px}
.hm button.dark{color:#fff}
.hm .more{margin-top:2px}
.hm button.sel{outline:2px solid var(--accent)}
.hm .hn{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm .hp{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hm .hc{display:block;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
@media (max-width:520px){.hm{grid-template-columns:repeat(3,1fr)}}
.hm-detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hm-detail .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.hm-detail .hd h3{font-size:16px;font-weight:700}
.hm-detail .hd small{color:var(--sub);font-size:12px}
.hm-detail .x{margin-left:auto;border:0;background:none;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
.noimg{font-size:13px;color:var(--sub);padding:24px 0;text-align:center;border:1px dashed var(--line);border-radius:10px;margin-top:4px}
.er{display:flex;gap:10px;padding:10px 2px;border-top:1px solid var(--line);align-items:center}
.er:first-child{border-top:0}
.er .n{flex:1;min-width:0}
.er .n small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .r{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.er .r b{display:block;font-weight:600}
.er .lk{display:flex;gap:6px;flex:none}
.er .lk a{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.er .lk a:hover{color:var(--text);background:var(--chip)}
.when{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px;background:var(--chip);color:var(--sub)}
.when.pre{color:var(--s2)} .when.post{color:var(--s1)}
@media (max-width:520px){.er{flex-wrap:wrap}.er .lk{width:100%;padding-left:0}}
.search{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);margin-bottom:6px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sq-note{font-size:12px;color:var(--sub);margin:6px 2px 2px}
.back{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.back:hover{color:var(--text)}
.sd-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.sd-head h3{font-size:19px;font-weight:700}
.sd-head small{color:var(--sub);font-size:12px}
.sd-head .px{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.sd-head .px b{font-size:20px;font-weight:700;margin-right:6px}
.simg{display:block;width:100%;border-radius:10px;background:#fff;border:1px solid var(--line);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.stats small{display:block;font-size:11px;color:var(--sub)}
.stats b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub2{font-size:13px;color:var(--sub);font-weight:500;margin:14px 0 4px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.links a:hover{background:var(--chip)}
.dc .dr{display:flex;gap:10px;padding:10px 2px;border-top:1px solid var(--line);align-items:flex-start}
.dc .dr:first-child{border-top:0}
.dr .tm{flex:none;width:40px;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
.dr .n{flex:1;min-width:0}
.dr .co,.er .co{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--text);cursor:pointer}
button.co:hover{text-decoration:underline}
span.co{cursor:default}
.dr a{display:block;color:var(--text);text-decoration:none;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.dr a:hover{text-decoration:underline}
.mk2{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--sub);margin-left:4px;vertical-align:1px}
.ct{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px;border:1px solid currentColor}
.ct.c-실적{color:var(--s1)} .ct.c-계약{color:var(--s3)} .ct.c-주주환원{color:var(--up)}
.ct.c-자금조달{color:var(--s2)} .ct.c-지분,.ct.c-기타,.ct.c-지배구조{color:var(--sub)}
.ct.c-계약·M\&A{color:var(--s3)} .ct.c-리스크{color:var(--down)}
.more{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:none;color:var(--sub);
  font:inherit;font-size:13px;padding:8px;border-radius:10px;cursor:pointer}
.more:hover{background:var(--chip);color:var(--text)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;
  font-variant-numeric:tabular-nums;display:none;z-index:2}
.tip b{display:block;margin-bottom:4px;font-weight:500;color:var(--sub)}
.tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.unit{font-size:12px;color:var(--sub);margin-left:auto}
/* 추정치 */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
.ctrl .filters{margin:0;flex-wrap:wrap}
.breadth{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.breadth .bl{font-size:13px;color:var(--sub)}
.breadth .bv{font-size:18px;font-weight:700}
.breadth .bar{flex:1;min-width:160px;height:8px;border-radius:4px;background:var(--chip);display:flex;overflow:hidden;gap:2px}
.breadth .bar span{display:block;height:100%}
.es a{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.es a:first-child{border-top:0}
.es a:hover{background:var(--chip)}
.es .rk{width:22px;flex:none;color:var(--sub);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.es .n{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es .n small{display:block;font-size:11.5px;color:var(--sub);font-weight:400;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.es .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.es .r b{display:block;font-weight:700}
.es .r span{font-size:12px;color:var(--sub)}
.es .tag{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:500;vertical-align:1px}
.es .tag.up{background:color-mix(in srgb,var(--up) 14%,transparent)}
.es .tag.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.note{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:48px 16px;text-align:center;color:var(--sub)}
.skel{height:300px;border-radius:14px;background:var(--card);border:1px solid var(--line);opacity:.6}

.nw a{display:block;padding:12px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.nw a:first-child{border-top:0}
.nw a:hover{background:var(--chip)}
.nw .t{font-weight:500;line-height:1.45}
.nw .tg{font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;font-weight:700;vertical-align:1px}
.nw .tg.flash{color:#fff;background:var(--up)}
.nw .tg.main{color:var(--accent);background:var(--chip)}
.nw .m{font-size:12px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.nw .s{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw .new{color:var(--up);font-weight:700;margin-left:4px}
/* 헬로키티 테마 */
:root[data-skin="kitty"]{
  --bg:#fff0f5; --card:#ffffff; --text:#4a2c3a; --sub:#a86b85; --line:#ffd1e1;
  --up:#e8174f; --down:#3f7fe0; --flat:#a86b85; --accent:#ff4f8b; --chip:#ffe4ee; --open:#ff4f8b;
  --s1:#ff4f8b; --s2:#e8174f; --s3:#4fb3e8; --grid:#ffe1ec; --axis:#c58aa3;
  --dot:#ffd6e5; --shadow:0 4px 16px rgba(255,79,139,.12);
}
@media (prefers-color-scheme: dark){
  :root[data-skin="kitty"]:not([data-theme="light"]){
    --bg:#2a1620; --card:#3a1f2d; --text:#ffe8f0; --sub:#e3a3be; --line:#5a3044;
    --up:#ff6b8f; --down:#7fb2ff; --flat:#e3a3be; --accent:#ff7aa8; --chip:#4a2738; --open:#ff7aa8;
    --s1:#ff7aa8; --s2:#ff4d6d; --s3:#6cc4f0; --grid:#4a2738; --axis:#c48aa3;
    --dot:#341b27; --shadow:0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-skin="kitty"][data-theme="dark"]{
  --bg:#2a1620; --card:#3a1f2d; --text:#ffe8f0; --sub:#e3a3be; --line:#5a3044;
  --up:#ff6b8f; --down:#7fb2ff; --flat:#e3a3be; --accent:#ff7aa8; --chip:#4a2738; --open:#ff7aa8;
  --s1:#ff7aa8; --s2:#ff4d6d; --s3:#6cc4f0; --grid:#4a2738; --axis:#c48aa3;
  --dot:#341b27; --shadow:0 4px 16px rgba(0,0,0,.3);
}
[data-skin="kitty"] body{background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 18%,transparent 19%),radial-gradient(var(--dot) 18%,transparent 19%);
  background-size:28px 28px;background-position:0 0,14px 14px}
[data-skin="kitty"] header{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);
  border-bottom:2px dashed var(--line)}
[data-skin="kitty"] .top h1,[data-skin="kitty"] .mhead h2{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;color:var(--accent)}
[data-skin="kitty"] .top h1{font-size:22px;letter-spacing:0}
[data-skin="kitty"] .mhead h2{font-size:19px}
[data-skin="kitty"] nav button{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;font-size:16px}
[data-skin="kitty"] nav button.on{color:var(--accent);font-weight:400;border-bottom-width:3px}
[data-skin="kitty"] section.mkt,[data-skin="kitty"] .breadth{border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
[data-skin="kitty"] section.mkt{position:relative}
[data-skin="kitty"] section.mkt::after{content:"🎀";position:absolute;top:-12px;right:14px;font-size:22px;transform:rotate(12deg)}
[data-skin="kitty"] .card{border-radius:18px;background:var(--card);transition:transform .15s}
[data-skin="kitty"] .card:hover{transform:translateY(-2px)}
[data-skin="kitty"] .filters button{border-width:2px}
[data-skin="kitty"] .filters button.on{color:#fff}
[data-skin="kitty"] .soon,[data-skin="kitty"] .skel{border-radius:22px}
[data-skin="kitty"] .tip{border-radius:14px;border-width:2px}
.kitty-face{display:none;width:30px;height:26px;vertical-align:-4px;margin-right:6px}
[data-skin="kitty"] .kitty-face{display:inline-block}
.skin-btn{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:999px;cursor:pointer;flex:none}
[data-skin="kitty"] .skin-btn{border-width:2px;color:var(--accent);font-weight:500}
.top .right{display:flex;align-items:center;gap:10px}
</style>

<body>
<header>
  <div class="top"><h1><svg class="kitty-face" viewBox="0 0 60 52" aria-hidden="true"><path d="M8 20 L6 4 L20 13 Z M52 20 L54 4 L40 13 Z" fill="#fff" stroke="#4a2c3a" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="30" cy="30" rx="25" ry="19" fill="#fff" stroke="#4a2c3a" stroke-width="2.5"/><ellipse cx="20" cy="31" rx="2.6" ry="3.4" fill="#4a2c3a"/><ellipse cx="40" cy="31" rx="2.6" ry="3.4" fill="#4a2c3a"/><ellipse cx="30" cy="36" rx="3" ry="2.2" fill="#ffd34d" stroke="#4a2c3a" stroke-width="1.2"/><path d="M3 30h9M3 35l9-2M57 30h-9M57 35l-9-2" stroke="#4a2c3a" stroke-width="2" stroke-linecap="round"/><g transform="translate(44 12) rotate(15)"><path d="M0 0 L-11 -8 L-11 8 Z M0 0 L11 -8 L11 8 Z" fill="#ff2d6f" stroke="#4a2c3a" stroke-width="1.5" stroke-linejoin="round"/><circle r="4" fill="#ff2d6f" stroke="#4a2c3a" stroke-width="1.5"/></g></svg>JIHONG Research</h1><div class="right"><span class="upd" id="upd">불러오는 중…</span><button class="skin-btn" id="skin">🎀 키티</button></div></div>
  <nav id="tabs">
    <button data-tab="kr" class="on">국장</button>
    <button data-tab="us">미장</button>
    <button data-tab="newhigh">신고가</button>
    <button data-tab="macro">매크로</button>
    <button data-tab="news">주요뉴스</button>
    <button data-tab="estimate">추정치</button>
  </nav>
</header>
<main>
  <div id="tab-kr" class="board"><div id="kr-top"><div class="skel"></div></div></div>
  <div id="tab-us" class="board" hidden><div id="us-top"><div class="skel"></div></div></div>
  <div id="tab-newhigh" hidden>
    <section class="mkt">
      <div class="mhead"><h2>오늘 52주 신고가</h2><span class="badge" id="nh-count">-</span>
        <span class="hours" id="nh-sort"></span></div>
      <div class="ctrl2 nh-ctrl">
        <div class="filters" id="nh-filter">
          <button data-m="all" class="on">전체</button><button data-m="코스피">코스피</button><button data-m="코스닥">코스닥</button>
        </div>
        <div class="filters" id="nh-cap">
          <button data-c="0" class="on">시총 전체</button><button data-c="3000">3천억 이상</button><button data-c="1000">1천억 이상</button>
        </div>
      </div>
      <div class="nh" id="nh-list"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
    </section>
  </div>
  <div id="tab-macro" hidden>
    <div class="filters" id="mc-range">
      <button data-d="30">1개월</button><button data-d="91" class="on">3개월</button>
      <button data-d="182">6개월</button><button data-d="365">1년</button>
    </div>
    <div class="mcols" id="mc-body"><div class="skel"></div></div>
  </div>
  <div id="tab-news" hidden>
    <section class="mkt">
      <div class="mhead"><h2>속보·주요뉴스</h2><span class="badge" id="nw-count">-</span>
        <span class="hours">네이버 증권</span></div>
      <div class="filters" id="nw-filter">
        <button data-k="all" class="on">전체</button><button data-k="flash">속보</button><button data-k="main">주요</button>
      </div>
      <div class="nw" id="nw-list"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
    </section>
  </div>
  <div id="tab-estimate" hidden>
    <div class="ctrl">
      <div class="filters" id="es-period"><button data-v="1" class="on">1주</button><button data-v="2">1개월</button></div>
      <div class="filters" id="es-item"><button data-v="op" class="on">영업이익</button><button data-v="np">순이익</button><button data-v="sales">매출</button><button data-v="eps">EPS</button></div>
      <div class="filters" id="es-year"></div>
      <div class="filters" id="es-market"><button data-v="all" class="on">전체</button><button data-v="코스피">코스피</button><button data-v="코스닥">코스닥</button></div>
    </div>
    <div class="breadth" id="es-breadth"></div>
    <div class="cols" id="es-body"><div class="skel"></div><div class="skel"></div></div>
    <p class="note" id="es-note"></p>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);

// 테마 전환 (헬로키티 ↔ 기본)
const skinLabel = () => $("#skin").textContent = document.documentElement.dataset.skin === "kitty" ? "기본 테마" : "🎀 키티 테마";
$("#skin").onclick = () => {
  const next = document.documentElement.dataset.skin === "kitty" ? "basic" : "kitty";
  document.documentElement.dataset.skin = next;
  try { localStorage.setItem("skin", next); } catch (e) {}
  skinLabel();
};
skinLabel();

// 탭 전환
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  const tab = b.dataset.tab, built = ["kr", "us", "newhigh", "macro", "news", "estimate"];
  for (const t of built) $("#tab-" + t).hidden = t !== tab;
  if (BOARDS[tab]) BOARDS[tab].load();
  if (tab === "newhigh") loadHighs();
  if (tab === "macro") loadMacro();
  if (tab === "news") loadNews();
  if (tab === "estimate") loadEstimates();
  try { localStorage.setItem("tab", b.dataset.tab); } catch (e) {}
});

const dir = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const arrow = v => v > 0 ? "▲" : v < 0 ? "▼" : "–";

function fmt(q, v) {
  if (v == null) return "-";
  const krwStock = q.currency === "KRW" && !q.symbol.startsWith("^") && q.symbol !== "KRW=X";
  const d = krwStock ? 0 : 2;
  return v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d});
}

function spark(arr, cls) {
  if (!arr || arr.length < 2) return "<svg></svg>";
  const min = Math.min(...arr), max = Math.max(...arr), span = max - min || 1;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * 100).toFixed(1)},${(30 - (v - min) / span * 28 - 1).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none"
    stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" class="${cls}" stroke-linejoin="round"/></svg>`;
}

// 지수 카드 → 네이버 증권 페이지
const NAVER_LINK = {
  "^KS11": "domestic/index/KOSPI/total", "^KQ11": "domestic/index/KOSDAQ/total",
  "KRW=X": "marketindex/exchange/FX_USDKRW",
  "^GSPC": "worldstock/index/.INX/total", "^IXIC": "worldstock/index/.IXIC/total",
  "^DJI": "worldstock/index/.DJI/total", "^SOX": "worldstock/index/.SOX/total",
  "NQ=F": "worldstock/index/NQcv1/total", "^VIX": "worldstock/index/.VIX/total",
};

function card(q) {
  const path = NAVER_LINK[q.symbol];
  const open = path ? `<a class="card" href="https://m.stock.naver.com/${path}" target="_blank" rel="noopener">` : `<div class="card">`;
  const close = path ? "</a>" : "</div>";
  if (q.error) return `${open}<div class="n">${q.name}</div><div class="err">불러오기 실패</div>${close}`;
  const c = dir(q.change);
  return `${open}<div class="n">${q.name}</div>
    <div class="p">${fmt(q, q.price)}</div>
    <div class="c ${c}">${arrow(q.change)} ${fmt(q, Math.abs(q.change))} (${q.pct >= 0 ? "+" : ""}${q.pct.toFixed(2)}%)</div>
    <div class="${c}">${spark(q.spark, "")}</div>${close}`;
}

function status(q) {
  const now = Date.now() / 1000;
  const live = q && q.open && now >= q.open && now <= q.close;
  const t = s => new Date(s * 1000).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
  return {
    badge: `<span class="badge ${live ? "live" : ""}">${live ? "장중" : "장마감"}</span>`,
    hours: q && q.open ? `한국시간 ${t(q.open)}–${t(q.close)}` : ""
  };
}

function market(title, idx, ref) {
  const s = status(ref);
  return `<section class="mkt">
    <div class="mhead"><h2>${title}</h2>${s.badge}<span class="hours">${s.hours}</span></div>
    <div class="grid">${idx.map(card).join("")}</div></section>`;
}

async function load() {
  try {
    const d = await (await fetch("data/market.json", {cache: "no-store"})).json();
    $("#kr-top").innerHTML = market("국장", d.kr_index, d.kr_index[0]);
    $("#us-top").innerHTML = market("미장", d.us_index, d.us_index[0]);
    $("#upd").textContent = "업데이트 " + new Date(d.updated * 1000).toLocaleTimeString("ko-KR", {hour12: false});
  } catch (e) {
    $("#upd").textContent = "연결 실패 · 다시 시도 중";
  }
}

// 국장·미장 탭: 지수 차트 · 종목검색 · 공시 (+ 미장은 실적 발표·컨콜)
const normName = t => String(t ?? "").replace(/\s|\(주\)|㈜|[.,]/g, "").toLowerCase();
const capTxt = v => v == null ? "-" : v >= 10000 ? (v / 10000).toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "조" : v.toLocaleString("ko-KR") + "억";
const usCap = m => m == null ? "-" : m >= 1e6 ? (m / 1e6).toLocaleString("ko-KR", {maximumFractionDigits: 2}) + "조 달러" : Math.max(1, Math.round(m / 100)).toLocaleString("ko-KR") + "억 달러";
const won = v => v == null ? "-" : v.toLocaleString("ko-KR");
const usd = v => v == null ? "-" : "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pctTxt = v => v == null ? "-" : `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
const WD = "일월화수목금토";
const mdw = d => { const t = new Date(d + "T00:00:00Z"); return `${t.getUTCMonth() + 1}/${t.getUTCDate()}(${WD[t.getUTCDay()]})`; };
const addDay = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
// 국장 정규장 5분 간격 (09:00 ~ 15:30)
const KR_SESSION = Array.from({length: 79}, (_, i) => { const m = 540 + i * 5; return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); });
const NAVER_IMG = "https://ssl.pstatic.net/imgfinance/chart/item/", WORLD_IMG = "https://financial-vn.pstatic.net/chart/mobile/world/item/";

const BOARD_CFG = {
  kr: {
    data: "data/kr.json", stocks: "data/stocks.json",
    idx: [["kospi", "코스피"], ["kosdaq", "코스닥"]],
    placeholder: "종목명 또는 코드 (예: 삼성전자, 005930)",
    discTitle: "오늘의 공시", discMkts: ["코스피", "코스닥"], discCats: ["실적", "계약", "주주환원", "자금조달", "지분"],
    defaultChart: "일봉",
    stock: r => ({code: r[0], name: r[1], tag: r[2] ? "코스닥" : "코스피", keys: [normName(r[1]), r[0]],
      sub: `${r[0]} · 시총 ${capTxt(r[5])}`, price: won(r[3]), pct: r[4], cap: r[5],
      imgs: {"당일": `${NAVER_IMG}area/day/${r[0]}.png`, "일봉": `${NAVER_IMG}candle/day/${r[0]}.png`, "주봉": `${NAVER_IMG}candle/week/${r[0]}.png`,
             "월봉": `${NAVER_IMG}candle/month/${r[0]}.png`, "1년": `${NAVER_IMG}area/year/${r[0]}.png`},
      stats: [["시가총액", capTxt(r[5])], ["거래대금", capTxt(r[6])], ["PER", r[7] == null ? "-" : r[7].toFixed(2) + "배"],
              ["PBR", r[8] == null ? "-" : r[8].toFixed(2) + "배"], ["52주 최고", won(r[9])], ["52주 최저", won(r[10])],
              ["외국인 비율", r[11] == null ? "-" : r[11].toFixed(1) + "%"]],
      links: [["네이버 증권", `https://m.stock.naver.com/domestic/stock/${r[0]}/total`],
              ["DART 전체 공시", `https://dart.fss.or.kr/dsab007/main.do?textCrpNm=${encodeURIComponent(r[1])}`]]}),
    discOf: (b, s) => b.data.disc.items.filter(d => normName(d.nm) === normName(s.name)),
    discFor: (b, d) => b.byName.get(normName(d.nm)),
    discLink: d => `https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${d.id}`,
    discDay: b => {
      const day = b.data.disc.day, today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
      return `DART · ${day ? day.slice(5).replace("-", "/") : ""}${day && day !== today ? " (최근 공시일)" : ""}`;
    },
  },
  us: {
    data: "data/us.json", stocks: "data/us_stocks.json",
    idx: [["spx", "S&P 500"], ["ndx", "나스닥"], ["dji", "다우"], ["sox", "필라델피아 반도체"]],
    placeholder: "종목명·티커 (예: 엔비디아, NVDA, Apple)",
    discTitle: "SEC 수시공시 (8-K)", discMkts: null, discCats: ["실적", "계약·M&A", "자금조달", "리스크", "지배구조"],
    defaultChart: "일봉",
    stock: r => {
      const img = r[7] ? {"당일": `${WORLD_IMG}day/${r[7]}_end.png`, "일봉": `${WORLD_IMG}candle/day/${r[7]}_end.png`,
        "주봉": `${WORLD_IMG}candle/week/${r[7]}_end.png`, "월봉": `${WORLD_IMG}candle/month/${r[7]}_end.png`,
        "1년": `${WORLD_IMG}area/year/${r[7]}_end.png`} : null;
      return {code: r[0], name: r[1] || r[2], eng: r[1] ? r[2] : null, tag: r[0],
        keys: [normName(r[1]), normName(r[2]), r[0].toLowerCase()], sub: `${r[1] ? r[2] + " · " : ""}시총 ${usCap(r[5])}`,
        price: usd(r[3]), pct: r[4], cap: r[5], imgs: img,
        stats: [["시가총액", usCap(r[5])], ["업종", r[6] || "-"]],
        links: [...(r[7] ? [["네이버 증권", `https://m.stock.naver.com/worldstock/stock/${r[7]}/total`]] : []),
                ["SEC 공시", `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(r[0])}&type=&dateb=&owner=include&count=40`],
                ["실적 일정", `https://www.nasdaq.com/market-activity/stocks/${r[0].toLowerCase().replace(".", "-")}/earnings`]]};
    },
    discOf: (b, s) => b.data.disc.items.filter(d => d.code === s.code),
    discFor: (b, d) => b.byCode.get(d.code),
    discLink: d => d.url,
    discDay: b => `SEC EDGAR · 최근 ${new Set(b.data.disc.items.map(d => d.d)).size}일`,
  },
};

function makeBoard(p, cfg) {
  const B = {p, cfg, data: null, at: 0, rows: null, rowsAt: 0, byName: new Map(), byCode: new Map(),
             kc: {idx: cfg.idx[0][0], range: 0}, dc: {mkt: "all", cat: "all", shown: 20}, sq: null, chart: cfg.defaultChart,
             earn: {day: null, big: true}, fl: {mk: "kospi", per: 1}, hm: {sort: "pct", sel: null, shown: 15, all: false}};
  const $p = id => document.getElementById(`${p}-${id}`);
  try { B.kc.idx = localStorage.getItem(p + "Idx") || B.kc.idx; B.kc.range = +(localStorage.getItem(p + "Range") || 0); } catch (e) {}
  if (!cfg.idx.some(x => x[0] === B.kc.idx)) B.kc.idx = cfg.idx[0][0];
  const chips = (id, list, cur) => `<div class="filters" id="${p}-${id}">${list.map(([v, t]) => `<button data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${t}</button>`).join("")}</div>`;
  const earnSec = p === "us" ? `<section class="mkt">
      <div class="mhead"><h2>실적 발표 · 컨콜</h2><span class="badge" id="${p}-ecount">-</span><span class="hours">나스닥 실적 캘린더 · 미국 날짜 기준</span></div>
      <div class="ctrl2"><div class="filters" id="${p}-eday"></div>${chips("ebig", [[1, "시총 100억 달러 이상"], [0, "전체"]], 1)}</div>
      <div id="${p}-elist"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
      <p class="sq-note">장전 발표는 한국시간 그날 밤, 장후 발표는 다음날 새벽(06시 전후)이고, 컨콜은 보통 발표 직후 열려요. ‘녹취록’은 컨콜 녹취록 검색으로 연결돼요.</p>
    </section>` : "";
  const krSecs = p === "kr" ? `<section class="mkt">
      <div class="mhead"><h2>투자자별 순매수</h2><span class="badge" id="${p}-fday">-</span><span class="hours">단위 억원 · 장중엔 잠정치</span></div>
      <div class="ctrl2">${chips("fmk", [["kospi", "코스피"], ["kosdaq", "코스닥"]], "kospi")}${chips("fper", [[1, "오늘"], [5, "5일"], [20, "20일"]], 1)}</div>
      <div id="${p}-flows"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
      <div class="fl-prog" id="${p}-prog"></div>
    </section>
    <section class="mkt">
      <div class="mhead"><h2>업종별 등락</h2><span class="badge" id="${p}-hcount">-</span><span class="hours">네이버 업종 · 누르면 종목</span></div>
      <div class="ctrl2">${chips("hsort", [["pct", "등락률순"], ["cap", "시총 큰 업종순"]], "pct")}</div>
      <div class="hm" id="${p}-hm"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
      <div id="${p}-hmd"></div>
    </section>` : "";
  $(`#tab-${p}`).insertAdjacentHTML("beforeend", `${krSecs}
    <section class="mkt">
      <div class="mhead"><h2>지수 차트</h2><span class="hours" id="${p}-cinfo"></span></div>
      <div class="ctrl2">${chips("idx", cfg.idx, B.kc.idx)}${chips("range", [[0, "당일"], [30, "1개월"], [91, "3개월"], [365, "1년"]], B.kc.range)}</div>
      <div class="tiles" id="${p}-tile"></div>
      <div class="chart" id="${p}-chart"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
    </section>
    ${earnSec}
    <div class="cols">
      <section class="mkt">
        <div class="mhead"><h2>종목 검색</h2><span class="hours" id="${p}-sqinfo"></span></div>
        <input class="search" id="${p}-sq" type="search" placeholder="${cfg.placeholder}" autocomplete="off">
        <div id="${p}-sqbody"></div>
      </section>
      <section class="mkt">
        <div class="mhead"><h2>${cfg.discTitle}</h2><span class="badge" id="${p}-dccount">-</span><span class="hours" id="${p}-dcday"></span></div>
        <div class="ctrl2">${cfg.discMkts ? chips("dcmkt", [["all", "전체"], ...cfg.discMkts.map(m => [m, m])], "all") : ""}
          ${chips("dccat", [["all", "모든 종류"], ...cfg.discCats.map(c => [c, c])], "all")}</div>
        <div class="dc" id="${p}-dclist"><div class="err" style="padding:24px 0">불러오는 중…</div></div>
      </section>
    </div>`);

  B.renderChart = () => {
    if (!B.data) return;
    const c = B.data.charts[B.kc.idx], box = $p("chart"), nm = cfg.idx.find(x => x[0] === B.kc.idx)[1];
    if (!c) { box.innerHTML = `<div class="err">불러오기 실패</div>`; return; }
    const intraday = B.kc.range === 0;
    const pts = intraday ? c.day : sinceDays(c.year, B.kc.range);
    if (!pts.length) { box.innerHTML = `<div class="err" style="padding:24px 0">데이터가 없어요</div>`; return; }
    const last = pts.at(-1)[1], base = intraday ? c.prev : pts[0][1], diff = last - base;
    const col = diff > 0 ? "var(--up)" : diff < 0 ? "var(--down)" : "var(--flat)";
    $p("tile").innerHTML = `<div class="tile"><div class="tn">${nm} · ${intraday ? "전일 대비" : "기간 수익률"}</div>
      <div class="tv">${num2(last, 2)}<small class="${dir(diff)}">${arrow(diff)} ${num2(Math.abs(diff), 2)} (${pctTxt(diff / base * 100)})</small></div></div>`;
    $p("cinfo").textContent = intraday ? `당일 5분 · 한국시간 ${pts.at(-1)[0]} 기준` : `일봉 · ${pts[0][0].replace(/-/g, ".")} ~ ${pts.at(-1)[0].replace(/-/g, ".")}`;
    // 당일 차트는 장이 끝날 때까지 빈 자리를 남겨 진행 상황이 보이게 한다
    let domain = null;
    if (intraday) {
      const sess = c.session || (p === "kr" ? KR_SESSION : null), labels = new Set(sess || []);
      domain = sess && pts.every(q => labels.has(q[0])) ? sess : pts.map(q => q[0]);
    }
    lineChart(box, [{name: nm, points: pts, color: col}], false, intraday ? {domain, ref: c.prev, label: d => d} : {});
  };

  const discRow = d => {
    const s = cfg.discFor(B, d);
    const co = s ? `<button class="co" data-code="${esc(s[0])}">${esc(d.nm)}</button>` : `<span class="co">${esc(d.nm)}</span>`;
    return `<div class="dr"><span class="tm">${esc(d.t)}</span><div class="n">${co}<span class="mk2">${esc(d.m || d.code)}</span>${d.cat !== "기타" ? `<span class="ct c-${d.cat}">${d.cat}</span>` : ""}
      <a href="${esc(cfg.discLink(d))}" target="_blank" rel="noopener">${esc(d.title)}</a></div></div>`;
  };

  B.renderDisc = () => {
    if (!B.data) return;
    const list = B.data.disc.items.filter(d => (B.dc.mkt === "all" || d.m === B.dc.mkt) && (B.dc.cat === "all" || d.cat === B.dc.cat));
    $p("dccount").textContent = list.length + "건";
    $p("dcday").textContent = cfg.discDay(B);
    $p("dclist").innerHTML = list.length
      ? list.slice(0, B.dc.shown).map(discRow).join("") + (list.length > B.dc.shown ? `<button class="more">더 보기 (${list.length - B.dc.shown}건 남음)</button>` : "")
      : `<div class="err" style="padding:24px 0">${B.data.disc.error ? "불러오기 실패" : "해당 공시가 없어요"}</div>`;
  };
  $p("dclist").addEventListener("click", e => {
    if (e.target.closest(".more")) { B.dc.shown += 30; B.renderDisc(); return; }
    const b = e.target.closest("button.co");
    if (b) { B.open(b.dataset.code); $p("sq").closest("section").scrollIntoView({behavior: "smooth", block: "start"}); }
  });

  // 실적 발표·컨콜 (미장)
  const whenTxt = (e) => e.when === "pre" ? `<span class="when pre">장전</span>` : e.when === "post" ? `<span class="when post">장후</span>` : `<span class="when">시간 미정</span>`;
  const kstHint = e => e.when === "pre" ? `한국 ${mdw(e.d)} 밤` : e.when === "post" ? `한국 ${mdw(addDay(e.d, 1))} 새벽` : "";
  const eps = v => v == null ? "-" : (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2);
  const earnRow = e => {
    const s = B.byCode.get(e.sym);
    const nm = s ? `<button class="co" data-code="${esc(e.sym)}">${esc(s[1] || e.nm)}</button>` : `<span class="co">${esc(e.nm)}</span>`;
    const res = e.eps != null
      ? `<b>${eps(e.eps)} <span class="${e.sur > 0 ? "up" : e.sur < 0 ? "down" : ""}">${e.sur == null ? "" : `(${e.sur > 0 ? "+" : ""}${e.sur.toFixed(1)}%)`}</span></b>예상 ${eps(e.est)}`
      : `<b>예상 ${eps(e.est)}</b>${e.ly != null ? `작년 ${eps(e.ly)}` : `${e.n || 0}명 추정`}`;
    const q = encodeURIComponent(`${e.sym} ${e.nm.split(/[,(]/)[0]} earnings call transcript ${e.q || ""}`);
    return `<div class="er"><div class="n">${nm}<span class="mk2">${esc(e.sym)}</span>${whenTxt(e)}
        <small>${usCap(e.cap)} · ${esc(e.q || "")} 분기${kstHint(e) ? " · " + kstHint(e) : ""}</small></div>
      <div class="r">${res}</div>
      <div class="lk"><a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">녹취록</a>
        <a href="https://www.nasdaq.com/market-activity/stocks/${e.sym.toLowerCase().replace(".", "-")}/earnings" target="_blank" rel="noopener">실적</a></div></div>`;
  };
  B.renderEarn = () => {
    if (p !== "us" || !B.data?.earn) return;
    const E = B.data.earn, all = E.items;
    if (!B.earn.day || !E.days.includes(B.earn.day)) {
      // 오늘(미국)부터 일정이 있는 가장 가까운 날
      B.earn.day = E.days.find(d => d >= E.today && all.some(x => x.d === d && x.cap >= 10000)) || E.days.at(-1);
    }
    $p("eday").innerHTML = E.days.map(d => `<button data-v="${d}" class="${d === B.earn.day ? "on" : ""}">${d === E.today ? "오늘 " : ""}${mdw(d)}</button>`).join("");
    const list = all.filter(x => x.d === B.earn.day && (!B.earn.big || x.cap >= 10000));
    $p("ecount").textContent = list.length + "개";
    $p("elist").innerHTML = list.length ? list.map(earnRow).join("")
      : `<div class="err" style="padding:24px 0">${E.error ? "불러오기 실패" : B.earn.big ? "시총 100억 달러 이상 발표가 없어요 · ‘전체’를 눌러 보세요" : "발표 일정이 없어요"}</div>`;
  };
  if (p === "us") {
    $p("eday").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { B.earn.day = b.dataset.v; B.renderEarn(); } });
    $p("elist").addEventListener("click", e => { const b = e.target.closest("button.co"); if (b) { B.open(b.dataset.code); $p("sq").closest("section").scrollIntoView({behavior: "smooth", block: "start"}); } });
  }

  // 투자자별 순매수 (국장)
  const eokSigned = v => v == null ? "-" : `${v > 0 ? "+" : ""}${v.toLocaleString("ko-KR")}억`;
  B.renderFlows = () => {
    if (p !== "kr" || !B.data) return;
    const F = B.data.flows, box = $p("flows");
    const rows = F?.[B.fl.mk] || [];
    if (!rows.length) { box.innerHTML = `<div class="err" style="padding:24px 0">수급 자료를 불러오지 못했어요</div>`; $p("prog").textContent = ""; return; }
    const per = Math.min(B.fl.per, rows.length), from = rows.length - per;
    $p("fday").textContent = per === 1 ? mdw(rows.at(-1).d) : `${mdw(rows[from].d)} ~ ${mdw(rows.at(-1).d)}`;
    const W = 300, H = 40;
    box.innerHTML = [["frg", "외국인"], ["inst", "기관"], ["ind", "개인"]].map(([k, who]) => {
      const sum = rows.slice(from).reduce((a, r) => a + (r[k] || 0), 0);
      const max = Math.max(1, ...rows.map(r => Math.abs(r[k] || 0))), bw = W / rows.length;
      const bars = rows.map((r, i) => {
        const v = r[k] || 0, h = Math.abs(v) / max * (H / 2 - 1);
        return `<rect x="${(i * bw + bw * 0.15).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" y="${(v > 0 ? H / 2 - h : H / 2).toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}"
          fill="var(${v >= 0 ? "--up" : "--down"})" opacity="${i >= from ? 1 : 0.28}"><title>${mdw(r.d)} ${who} ${eokSigned(v)}</title></rect>`;
      }).join("");
      return `<div class="fl-row"><span class="who">${who}</span><span class="v ${dir(sum)}">${eokSigned(sum)}</span>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--grid)"/>${bars}</svg></div>`;
    }).join("") + `<div class="sq-note">막대는 최근 ${rows.length}거래일 (진한 부분이 선택한 기간)</div>`;
    const pg = F.program?.[B.fl.mk];
    $p("prog").innerHTML = pg && pg.total != null ? `오늘 프로그램 매매 · 차익 <b class="${dir(pg.arb)}">${eokSigned(pg.arb)}</b> · 비차익 <b class="${dir(pg.nonarb)}">${eokSigned(pg.nonarb)}</b> · 합계 <b class="${dir(pg.total)}">${eokSigned(pg.total)}</b>` : "";
  };

  // 업종별 등락 히트맵 (국장)
  B.renderSectors = () => {
    if (p !== "kr" || !B.data) return;
    const S = B.data.sectors, box = $p("hm");
    if (!S?.length) { box.innerHTML = `<div class="err" style="padding:24px 0">업종 자료를 불러오지 못했어요</div>`; return; }
    let list = [...S].sort((a, b) => B.hm.sort === "cap" ? b.cap - a.cap : (b.pct ?? 0) - (a.pct ?? 0));
    // 폰처럼 좁은 화면에서는 처음에 위·아래 10개씩만 (등락률순) 또는 상위 20개 (시총순)
    const fold = !B.hm.all && innerWidth < 700 && list.length > 20;
    if (fold) list = B.hm.sort === "cap" ? list.slice(0, 20) : [...list.slice(0, 10), ...list.slice(-10)];
    const up = S.filter(x => x.pct > 0).length, dn = S.filter(x => x.pct < 0).length;
    $p("hcount").textContent = `상승 ${up} · 하락 ${dn}`;
    box.innerHTML = list.map(x => {
      const a = x.pct ? Math.min(85, 12 + Math.abs(x.pct) / 4 * 73) : 0;
      return `<button data-no="${x.no}" class="${a > 55 ? "dark" : ""} ${B.hm.sel === x.no ? "sel" : ""}"
        style="--tint:var(${x.pct > 0 ? "--up" : x.pct < 0 ? "--down" : "--chip"});--a:${a.toFixed(0)}%" title="${esc(x.nm)} ${pctTxt(x.pct)}">
        <span class="hn">${esc(x.nm)}</span><span class="hp">${pctTxt(x.pct)}</span><span class="hc">▲${x.up ?? 0} ▼${x.dn ?? 0}</span></button>`;
    }).join("") + (fold ? `<button class="more hm-all" style="grid-column:1/-1">${B.hm.sort === "cap" ? "" : "가운데 "}${S.length - 20}개 업종 더 보기</button>`
                        : B.hm.all && innerWidth < 700 ? `<button class="more hm-all" style="grid-column:1/-1">접기</button>` : "");
    B.renderSectorDetail();
  };
  B.renderSectorDetail = () => {
    const box = $p("hmd"), x = B.data?.sectors?.find(s => s.no === B.hm.sel);
    if (!x) { box.innerHTML = ""; return; }
    const ms = x.stocks;
    box.innerHTML = `<div class="hm-detail"><div class="hd"><h3>${esc(x.nm)}</h3><span class="${dir(x.pct)}" style="font-weight:700">${pctTxt(x.pct)}</span>
        <small>${ms.length}종목 · 시총 ${capTxt(x.cap)} · 상승 ${x.up ?? 0} · 하락 ${x.dn ?? 0}</small><button class="x">닫기 ✕</button></div>
      <div class="sq-note">시가총액 큰 순 · 종목을 누르면 아래 종목 검색에서 자세히 보여줘요</div>
      <div class="nh">${ms.slice(0, B.hm.shown).map(m => `<a href="#" data-code="${m[0]}"><div class="n">${esc(m[1])}<span class="mk">${m[2] ? "코스닥" : "코스피"}</span>
        <small>${m[0]} · 시총 ${capTxt(m[4])}</small></div><div class="r"><b class="${dir(m[3])}">${pctTxt(m[3])}</b></div></a>`).join("")}</div>
      ${ms.length > B.hm.shown ? `<button class="more">더 보기 (${ms.length - B.hm.shown}종목 남음)</button>` : ""}</div>`;
  };
  if (p === "kr") {
    $p("hm").addEventListener("click", e => {
      if (e.target.closest(".hm-all")) { B.hm.all = !B.hm.all; B.renderSectors(); return; }
      const b = e.target.closest("button[data-no]");
      if (!b) return;
      const no = +b.dataset.no;
      B.hm.sel = B.hm.sel === no ? null : no; B.hm.shown = 15;
      $p("hm").querySelectorAll("button").forEach(x => x.classList.toggle("sel", +x.dataset.no === B.hm.sel));
      B.renderSectorDetail();
      if (B.hm.sel) $p("hmd").scrollIntoView({behavior: "smooth", block: "nearest"});
    });
    $p("hmd").addEventListener("click", e => {
      if (e.target.closest(".x")) { B.hm.sel = null; B.renderSectors(); return; }
      if (e.target.closest(".more")) { B.hm.shown += 30; B.renderSectorDetail(); return; }
      const a = e.target.closest("a[data-code]");
      if (a) { e.preventDefault(); B.open(a.dataset.code); $p("sq").closest("section").scrollIntoView({behavior: "smooth", block: "start"}); }
    });
  }

  const line = s => `<a href="#" data-code="${esc(s.code)}"><div class="n">${esc(s.name)}<span class="mk">${esc(s.tag)}</span>
      <small>${esc(s.sub)}</small></div><div class="r"><b>${s.price}</b><span class="${dir(s.pct)}">${pctTxt(s.pct)}</span></div></a>`;

  B.search = () => {
    if (!B.rows) return;
    const raw = $p("sq").value, q = normName(raw), body = $p("sqbody");
    B.sq = null;
    if (!q) { body.innerHTML = `<div class="sq-note">시가총액 상위 10</div><div class="nh">${B.rows.slice(0, 10).map(r => line(cfg.stock(r))).join("")}</div>`; return; }
    const hit = [];
    for (const r of B.rows) {
      const ks = cfg.stock(r).keys.filter(Boolean);
      const score = ks.some(k => k === q) ? 0 : ks.some(k => k.startsWith(q)) ? 1 : ks.some(k => k.includes(q)) ? 2 : -1;
      if (score >= 0) hit.push([score, r]);
    }
    hit.sort((a, b) => a[0] - b[0]);  // 같은 점수 안에서는 시총 순서 유지
    body.innerHTML = hit.length
      ? `<div class="sq-note">${hit.length}종목${hit.length > 30 ? " · 상위 30개만 표시" : ""}</div><div class="nh">${hit.slice(0, 30).map(h => line(cfg.stock(h[1]))).join("")}</div>`
      : `<div class="err" style="padding:24px 0">‘${esc(raw)}’에 맞는 종목이 없어요</div>`;
  };

  B.open = code => {
    const r = B.byCode.get(code);
    if (!r) return;
    B.sq = code;
    const s = cfg.stock(r), disc = B.data ? cfg.discOf(B, s) : [];
    const bust = Math.floor(Date.now() / 900000);  // 15분마다 차트 이미지 새로
    if (s.imgs && !s.imgs[B.chart]) B.chart = cfg.defaultChart;
    const earn = p === "us" && B.data?.earn ? B.data.earn.items.filter(e => e.sym === code) : [];
    $p("sqbody").innerHTML = `<button class="back">← 목록</button>
      <div class="sd-head"><h3>${esc(s.name)}</h3><small>${esc(s.eng ? s.eng + " · " : "")}${esc(s.code)}${p === "kr" ? " · " + s.tag : ""}</small>
        <div class="px"><b>${s.price}</b><span class="${dir(s.pct)}">${arrow(s.pct)} ${pctTxt(s.pct)}</span></div></div>
      ${s.imgs ? `${chips("sdchart", Object.keys(s.imgs).map(k => [k, k]), B.chart)}
        <img class="simg" id="${p}-sdimg" alt="${esc(s.name)} ${B.chart} 차트" src="${s.imgs[B.chart]}?t=${bust}">
        <div class="noimg" id="${p}-noimg" hidden>차트 이미지를 불러오지 못했어요</div>`
        : `<div class="noimg">이 종목은 차트 이미지가 없어요 · 아래 링크에서 확인하세요</div>`}
      <div class="stats">${s.stats.map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join("")}</div>
      ${earn.length ? `<div class="sub2">실적 발표 일정</div><div>${earn.map(earnRow).join("")}</div>` : ""}
      <div class="sub2">${p === "kr" ? "오늘 공시" : "최근 8-K 공시"} ${disc.length ? disc.length + "건" : ""}</div>
      <div class="dc">${disc.length ? disc.map(discRow).join("") : `<div class="err" style="padding:8px 0">${p === "kr" ? "오늘 올라온 공시가 없어요" : "최근 며칠 사이 8-K가 없어요"}</div>`}</div>
      <div class="links">${s.links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`;
    const img = $p("sdimg");
    if (img) {
      img.onerror = () => { img.classList.add("miss"); $p("noimg").hidden = false; };
      img.onload = () => { img.classList.remove("miss"); $p("noimg").hidden = true; };
    }
  };

  $p("sq").addEventListener("input", B.search);
  $p("sq").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const first = $p("sqbody").querySelector("a[data-code]");
    if (first) B.open(first.dataset.code);
  });
  $p("sqbody").addEventListener("click", e => {
    if (e.target.closest(".back")) { B.search(); return; }
    const c = e.target.closest("#" + p + "-sdchart button");
    if (c) {
      $p("sdchart").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === c));
      B.chart = c.dataset.v;
      const s = cfg.stock(B.byCode.get(B.sq)), img = $p("sdimg");
      img.src = `${s.imgs[B.chart]}?t=${Math.floor(Date.now() / 900000)}`;
      img.alt = `${s.name} ${B.chart} 차트`;
      return;
    }
    const a = e.target.closest("a[data-code]");
    if (a) { e.preventDefault(); B.open(a.dataset.code); return; }
    const co = e.target.closest("button.co");
    if (co) B.open(co.dataset.code);
  });

  const bindChips = (id, after) => $p(id)?.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    $p(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    after(b.dataset.v);
  });
  bindChips("idx", v => { B.kc.idx = v; try { localStorage.setItem(p + "Idx", v); } catch (e) {} B.renderChart(); });
  bindChips("range", v => { B.kc.range = +v; try { localStorage.setItem(p + "Range", v); } catch (e) {} B.renderChart(); });
  bindChips("dcmkt", v => { B.dc.mkt = v; B.dc.shown = 20; B.renderDisc(); });
  bindChips("dccat", v => { B.dc.cat = v; B.dc.shown = 20; B.renderDisc(); });
  bindChips("ebig", v => { B.earn.big = v === "1"; B.renderEarn(); });
  bindChips("fmk", v => { B.fl.mk = v; B.renderFlows(); });
  bindChips("fper", v => { B.fl.per = +v; B.renderFlows(); });
  bindChips("hsort", v => { B.hm.sort = v; B.renderSectors(); });

  B.load = async () => {
    const jobs = [];
    if (!B.data || Date.now() - B.at > 300000) jobs.push(fetch(cfg.data, {cache: "no-store"}).then(r => r.json()).then(d => {
      B.data = d; B.at = Date.now();
    }).catch(() => {
      if (!B.data) for (const id of ["chart", "dclist", "elist", "flows", "hm"]) if ($p(id)) $p(id).innerHTML = `<div class="err" style="padding:24px 0">불러오기 실패 · 다시 시도 중</div>`;
    }));
    if (!B.rows || Date.now() - B.rowsAt > 600000) jobs.push(fetch(cfg.stocks, {cache: "no-store"}).then(r => r.json()).then(d => {
      B.rows = d.rows; B.rowsAt = Date.now();
      B.byCode = new Map(B.rows.map(r => [r[0], r]));
      B.byName = new Map(B.rows.map(r => [normName(r[1]), r]));
      $p("sqinfo").textContent = `${B.rows.length.toLocaleString("ko-KR")}종목`;
    }).catch(() => {
      if (!B.rows) $p("sqbody").innerHTML = `<div class="err" style="padding:24px 0">종목 목록을 불러오지 못했어요</div>`;
    }));
    if (!jobs.length) return;
    await Promise.all(jobs);
    B.renderFlows(); B.renderSectors(); B.renderChart(); B.renderDisc(); B.renderEarn();
    // 상세를 보고 있으면 새 시세로 다시 그리고, 아니면 목록 갱신
    if (B.rows) B.sq ? B.open(B.sq) : B.search();
  };
  return B;
}
const BOARDS = Object.fromEntries(Object.entries(BOARD_CFG).map(([p, cfg]) => [p, makeBoard(p, cfg)]));

// 뉴스 탭
let news = null, newsKind = "all";
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return m + "분 전";
  if (m < 24 * 60) return Math.floor(m / 60) + "시간 전";
  return new Date(iso).toLocaleDateString("ko-KR", {month: "numeric", day: "numeric"});
}

// 매크로 탭
let macroData = null, macroAt = 0, macroDays = 91;
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)"];
const MACRO_SECTIONS = [
  {key: "oil", title: "유가", unit: "달러/배럴", rate: false},
  {key: "kr_bond", title: "한국 국채 금리", unit: "%", rate: true},
  {key: "us_bond", title: "미국 국채 금리", unit: "%", rate: true},
  {key: "dxy", title: "달러인덱스", unit: "포인트", rate: false},
  {key: "gold", title: "금", unit: "달러/온스", rate: false},
];
const num2 = (v, d) => v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d});
try { const d = +localStorage.getItem("macroDays"); if (d) macroDays = d; } catch (e) {}

function sinceDays(points, days) {
  const cut = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  return points.filter(p => p[0] >= cut);
}

function tileHTML(s, i, rate) {
  const pts = s.points, last = pts.at(-1), prev = pts.at(-2);
  const diff = last && prev ? last[1] - prev[1] : 0;
  const chg = rate ? `${diff >= 0 ? "+" : ""}${(diff * 100).toFixed(1)}bp`
                   : `${diff >= 0 ? "+" : ""}${(diff / prev[1] * 100).toFixed(2)}%`;
  return `<div class="tile"><div class="tn"><i style="background:${COLORS[i]}"></i>${s.name}</div>
    <div class="tv">${last ? num2(last[1], rate ? 3 : 2) : "-"}<small class="${dir(diff)}">${arrow(diff)} ${chg}</small></div></div>`;
}

function lineChart(box, series, rate, opt = {}) {
  const W = Math.max(box.clientWidth, 280), H = W < 500 ? 190 : 230;
  const pad = {l: 8, r: 44, t: 10, b: 22};
  const dates = opt.domain || [...new Set(series.flatMap(s => s.points.map(p => p[0])))].sort();
  const axisLabel = opt.label || (d => d.slice(2).replace(/-/g, ".")), tipLabel = opt.label || (d => d.replace(/-/g, "."));
  const color = (s, i) => s.color || COLORS[i];
  if (dates.length < 2) { box.innerHTML = `<div class="err">데이터가 부족해요</div>`; return; }
  const vals = series.flatMap(s => s.points.map(p => p[1])).concat(opt.ref != null ? [opt.ref] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * 0.08 || 1; lo -= padv; hi += padv;
  const x = d => pad.l + dates.indexOf(d) / (dates.length - 1) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  // 눈금
  const step = (hi - lo) / 4, ticks = [0, 1, 2, 3, 4].map(i => lo + step * i);
  const grid = ticks.map(t => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text x="${W - pad.r + 6}" y="${y(t) + 4}">${num2(t, rate || hi - lo < 20 ? (rate ? 2 : 1) : 0)}</text>`).join("");
  const xi = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
  const xl = xi.map((i, k) => `<text x="${x(dates[i])}" y="${H - 4}" text-anchor="${["start", "middle", "end"][k]}">${axisLabel(dates[i])}</text>`).join("");
  const ref = opt.ref == null ? "" : `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="var(--axis)" stroke-dasharray="4 4"/>
    <text x="${pad.l + 2}" y="${y(opt.ref) - 4}">전일 ${num2(opt.ref, 2)}</text>`;
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${color(s, i)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
    points="${s.points.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")}"/>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${grid}${ref}${xl}${lines}
    <g class="hover" style="display:none"><line class="cx" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-dasharray="3 3"/>
    ${series.map((s, i) => `<circle r="4.5" fill="${color(s, i)}" stroke="var(--card)" stroke-width="2"/>`).join("")}</g>
    <rect x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent" style="touch-action:pan-y"/></svg>
    <div class="tip"></div>`;
  const svg = box.querySelector("svg"), g = box.querySelector(".hover"), tip = box.querySelector(".tip");
  const valueAt = (s, d) => { let v = null; for (const p of s.points) { if (p[0] > d) break; v = p[1]; } return v; };
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.round((px - pad.l) / (W - pad.l - pad.r) * (dates.length - 1));
    const d = dates[Math.max(0, Math.min(dates.length - 1, i))], cx = x(d);
    g.style.display = "";
    g.querySelector(".cx").setAttribute("x1", cx); g.querySelector(".cx").setAttribute("x2", cx);
    const rows = series.map((s, k) => {
      const v = valueAt(s, d), c = g.querySelectorAll("circle")[k];
      c.style.display = v == null ? "none" : ""; if (v != null) { c.setAttribute("cx", cx); c.setAttribute("cy", y(v)); }
      return `<div><span><i style="background:${color(s, k)}"></i>${s.name}</span><span>${v == null ? "-" : num2(v, rate ? 3 : 2)}</span></div>`;
    }).join("");
    tip.innerHTML = `<b>${tipLabel(d)}</b>${rows}`;
    tip.style.display = "block";
    const left = cx * r.width / W, tw = tip.offsetWidth;
    tip.style.left = (left + 12 + tw > r.width ? left - tw - 12 : left + 12) + "px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { g.style.display = "none"; tip.style.display = "none"; });
}

function renderMacro() {
  if (!macroData) return;
  $("#mc-body").innerHTML = MACRO_SECTIONS.map(m => `<section class="mkt">
      <div class="mhead"><h2>${m.title}</h2><span class="unit">단위: ${m.unit}</span></div>
      <div class="tiles">${macroData[m.key].map((s, i) => tileHTML(s, i, m.rate)).join("")}</div>
      <div class="chart" id="ch-${m.key}"></div></section>`).join("");
  for (const m of MACRO_SECTIONS) {
    const series = macroData[m.key].map(s => ({name: s.name, points: sinceDays(s.points, macroDays)}));
    lineChart($("#ch-" + m.key), series, m.rate);
  }
}

async function loadMacro() {
  if (macroData && Date.now() - macroAt < 600000) return renderMacro();
  try {
    macroData = await (await fetch("data/macro.json", {cache: "no-store"})).json();

document.querySelectorAll("#mc-range button").forEach(b => {

let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (!$("#tab-macro").hidden) renderMacro(); for (const b of Object.values(BOARDS)) if (!$("#tab-" + b.p).hidden) b.renderChart(); }, 150); });

// 추정치 탭
let est = null, estAt = 0;
const es = {period: 1, item: "op", year: null, market: "all"};
const ITEM_NAME = {op: "영업이익", np: "순이익", sales: "매출", eps: "EPS"};
const MIN_BASE = 10; // 억원. 이보다 작은 값은 변화율이 과장돼서 제외

function money(v, item) {
  if (v == null) return "-";
  if (item === "eps") return Math.round(v).toLocaleString("ko-KR") + "원";
  const a = Math.abs(v);
  return a >= 10000 ? (v / 10000).toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "조"
                    : Math.round(v).toLocaleString("ko-KR") + "억";
}

function estRows() {
  const out = [];
  for (const s of est.stocks) {
    if (es.market !== "all" && s.market !== es.market) continue;
    const v = s[es.year]?.[es.item];
    if (!v || v[0] == null || v[es.period] == null) continue;
    const cur = v[0], prev = v[es.period], diff = cur - prev;
    if (Math.abs(diff) < 1e-9) continue;
    if (es.item !== "eps" && Math.max(Math.abs(cur), Math.abs(prev)) < MIN_BASE) continue;
    let rate, tag = "";
    if (prev === 0) { rate = diff > 0 ? -1e9 : 1e9; tag = "신규 추정"; }  // 이전 추정치가 없던 종목 → 목록 맨 뒤
    else if (prev < 0 && cur > 0) { rate = Infinity; tag = "흑자전환"; }
    else if (prev > 0 && cur <= 0) { rate = -Infinity; tag = "적자전환"; }
    else if (prev < 0 && cur < 0) { rate = diff / Math.abs(prev) * 100; tag = diff > 0 ? "적자축소" : "적자확대"; }
    else rate = diff / prev * 100;
    out.push({s, cur, prev, diff, rate, tag});
  }
  return out;
}

function estRow(r, i) {
  const c = r.diff > 0 ? "up" : "down";
  const rateTxt = r.tag === "신규 추정" || !isFinite(r.rate) ? r.tag : `${r.rate > 0 ? "+" : ""}${r.rate.toFixed(1)}%`;
  return `<a href="https://navercomp.wisereport.co.kr/v2/company/c1050001.aspx?cmp_cd=${r.s.code}" target="_blank" rel="noopener">
    <span class="rk">${i + 1}</span>
    <div class="n">${r.s.name}${r.tag && isFinite(r.rate) && r.tag !== "신규 추정" ? `<span class="tag ${c}">${r.tag}</span>` : ""}
      <small>${money(r.prev, es.item)} → <b style="color:var(--text);font-weight:500">${money(r.cur, es.item)}</b> · 주가 ${r.s.price.toLocaleString("ko-KR")} <span class="${dir(r.s.pct)}">${r.s.pct >= 0 ? "+" : ""}${r.s.pct.toFixed(1)}%</span></small></div>
    <div class="r"><b class="${c}">${rateTxt}</b><span>${r.diff > 0 ? "+" : ""}${money(r.diff, es.item)}</span></div></a>`;
}

function renderEst() {
  if (!est) return;
  if (!est.stocks.length) {
    $("#es-body").innerHTML = `<div class="soon" style="grid-column:1/-1">추정치 데이터를 모으는 중이에요. 몇 분 뒤에 다시 열어주세요.</div>`;
    return;
  }
  const rows = estRows();
  const ups = rows.filter(r => r.diff > 0).sort((a, b) => b.rate - a.rate);
  const downs = rows.filter(r => r.diff < 0).sort((a, b) => a.rate - b.rate);
  const covered = est.stocks.filter(s => (es.market === "all" || s.market === es.market) && s[es.year]?.[es.item]?.[0] != null).length;
  const flat = covered - ups.length - downs.length;
  const per = es.period === 1 ? "1주" : "1개월";
  const w = n => covered ? (n / covered * 100).toFixed(1) + "%" : "0";
  $("#es-breadth").innerHTML = `
    <div><div class="bl">${per} 상향</div><div class="bv up">${ups.length}종목</div></div>
    <div><div class="bl">${per} 하향</div><div class="bv down">${downs.length}종목</div></div>
    <div><div class="bl">변화 없음</div><div class="bv">${flat}종목</div></div>
    <div class="bar" title="상향 ${ups.length} · 변화없음 ${flat} · 하향 ${downs.length}">
      <span style="width:${w(ups.length)};background:var(--up)"></span><span style="width:${w(flat)};background:var(--line)"></span><span style="width:${w(downs.length)};background:var(--down)"></span></div>`;
  const list = (title, arr, cls) => `<section class="mkt"><div class="mhead"><h2 class="${cls}">${title}</h2>
      <span class="badge">${arr.length}종목</span><span class="hours">${ITEM_NAME[es.item]} · ${es.year.slice(0, 4)}년 · ${per} 변화율 순</span></div>
      <div class="es">${arr.length ? arr.slice(0, 50).map(estRow).join("") : `<div class="err" style="padding:24px 0">해당 종목이 없어요</div>`}</div></section>`;
  $("#es-body").innerHTML = list("▲ 상향", ups, "up") + list("▼ 하향", downs, "down");
  const t = new Date(est.updated * 1000);
  $("#es-note").textContent = `시가총액 상위 ${est.stocks.length}종목 기준 · WiseReport 컨센서스 · ${t.toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false})} 수집 · 하루 1번 갱신. `
    + `${es.item === "eps" ? "" : `${MIN_BASE}억 미만은 변화율이 과장돼 제외. `}종목을 누르면 상세 컨센서스가 열려요.`;
}

async function loadEstimates() {
  if (est && est.stocks.length && Date.now() - estAt < 600000) return renderEst();
  try {
    est = await (await fetch("data/estimates.json", {cache: "no-store"})).json();
    estAt = Date.now();
    if (est.years) {
      if (!es.year || !est.years.includes(es.year)) es.year = est.years[0];
      $("#es-year").innerHTML = est.years.map(y => `<button data-v="${y}" class="${y === es.year ? "on" : ""}">${y.slice(0, 4)}년</button>`).join("");
      bindChips("#es-year", "year", v => v);
    }
    renderEst();
  } catch (e) {
    $("#es-body").innerHTML = `<div class="soon" style="grid-column:1/-1">불러오기 실패 · 잠시 후 다시 시도해 주세요</div>`;
  }
}

function bindChips(sel, key, conv) {
  document.querySelectorAll(sel + " button").forEach(b => b.onclick = () => {
    document.querySelectorAll(sel + " button").forEach(x => x.classList.toggle("on", x === b));
    es[key] = conv(b.dataset.v);
    renderEst();
  });
}
bindChips("#es-period", "period", Number);
bindChips("#es-item", "item", v => v);
bindChips("#es-market", "market", v => v);

try { const t = localStorage.getItem("tab"); if (t) document.querySelector(`#tabs [data-tab="${t}"]`)?.click(); } catch (e) {}
load();
for (const b of Object.values(BOARDS)) if (!$("#tab-" + b.p).hidden) b.load();
setInterval(() => { load(); for (const b of Object.values(BOARDS)) if (!$("#tab-" + b.p).hidden) b.load(); if (!$("#tab-newhigh").hidden) loadHighs(); if (!$("#tab-news").hidden) loadNews(); }, 60000);
</script>
